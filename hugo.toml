baseURL = "https://example.com/"
languageCode = "en-us"
title = "My Site"
theme = "PaperMod"
enableGitInfo = true

[frontmatter]
  lastmod = [":git", "lastmod", "date"]
[pagination]
  pagerSize = 10

[params]
  author = "Your Name"
  description = "A personal site and blog"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowLastMod = true

  [params.homeInfoParams]
    Title = "Hi, I'm Your Name"
    Content = "Welcome to my site. I write about things I find interesting."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourusername"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
