baseURL = "https://shishiun-site.vercel.app/"
languageCode = "en-us"
title = "ShiShiun's Note"
enableGitInfo = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\[', '\]']]
          inline = [['$', '$'], ['\(', '\)']]

[permalinks]
  posts = "/:year/:month/:contentbasename/"

[frontmatter]
  lastmod = [":git", "lastmod", "date"]
[pagination]
  pagerSize = 10

[params]
  author = "ShiShiun Chen"
  description = "A personal site and blog"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowLastMod = true

  images = ["/og-default.png"]

  [params.assets]
    favicon = "/favicon.ico"
    favicon32x32 = "/favicon-96x96.png"
    apple_touch_icon = "/apple-touch-icon.png"

    disableHLJS = true

  [params.homeInfoParams]
    Title = "ShiShiun's Note"
    Content = "Notes about my life."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/georgemouse"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/shi-shiun-chen/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[params.vercel_analytics]
enable = true

[params.vercel_speed_insights]
enable = true
