<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pangu/4.0.7/pangu.min.js"
    onload="document.addEventListener('DOMContentLoaded', () => pangu.autoSpacingPage())"></script>
{{- if or .Params.math site.Params.math -}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
    onload="renderMathInElement(document.body, {
        delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false
    });"></script>
{{- end -}}

<!-- Vercel Web Analytics -->
{{ if and site.Params.vercel_analytics.enable (not hugo.IsServer) }}
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
{{ end }}

<!-- Vercel Speed Insights -->
{{ if and site.Params.vercel_speed_insights.enable (not hugo.IsServer) }}
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
{{ end }}
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
